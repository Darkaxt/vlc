name: Native desktop packages
on:
  push:
    branches: [codex/native-desktop]
  workflow_dispatch:
    inputs:
      target:
        description: Native build target
        type: choice
        options: [macos-arm64, macos-intel, linux-x86_64, linux-aarch64, all]
        default: macos-arm64
      package_artifact:
        description: Optional existing Linux artifact ID for compiler-free package checks
        type: string
        default: ''
      package_source:
        description: Exact source SHA of that artifact (required in package-check mode)
        type: string
        default: ''
      startup_trace:
        description: Collect normal Linux startup thread stacks from the recovered artifact; not acceptance
        type: boolean
        default: false
      trace_engine:
        description: Engine for the compiler-free diagnostic (MPV follows EOF through exit or crash)
        type: choice
        options: [vlc, mpv]
        default: vlc
      native_ui_only:
        description: Diagnostic UI pass only; requires a verified unchanged normal runtime and does not qualify packages
        type: boolean
        default: false
      cache_compaction:
        description: Optional exact existing cache/artifact/source JSON for compiler-free retention migration
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.cache_compaction != '' && format('desktop-cache-{0}-{1}', github.ref, inputs.target) || format('desktop-packages-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  matrix:
    if: ${{ inputs.package_artifact == '' && inputs.cache_compaction == '' }}
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: select
        env:
          TARGET: ${{ inputs.target || 'macos-arm64' }}
        run: python3 tools/desktop-player/select-ci-targets.py
  build:
    needs: matrix
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      # Architectures own separate hosted machines and independent build caches.
      # Each build still uses one compiler job; no local WSL budget is changed.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create native work directory
        run: mkdir -p "$GITHUB_WORKSPACE/.desktop-build" "$GITHUB_WORKSPACE/.desktop-toolchain"
      - name: Install native dependencies
        run: bash tools/desktop-player/install-ci-dependencies.sh "$GITHUB_WORKSPACE/.desktop-toolchain"
      - name: Bind the actual installed native toolchain
        id: toolchain
        run: python3 tools/desktop-player/bind-ci-toolchain.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: .desktop-build
          key: native-${{ matrix.target }}-${{ steps.toolchain.outputs.sha256 }}-${{ hashFiles('configure.ac', 'modules/gui/qt/qt6.pro', 'modules/gui/qt/player/mpv/source-portable.json', 'tools/desktop-player/native-inputs.json', 'contrib/src/medialibrary/**') }}-${{ github.run_id }}
          restore-keys: |
            native-${{ matrix.target }}-${{ steps.toolchain.outputs.sha256 }}-${{ hashFiles('configure.ac', 'modules/gui/qt/qt6.pro', 'modules/gui/qt/player/mpv/source-portable.json', 'tools/desktop-player/native-inputs.json', 'contrib/src/medialibrary/**') }}-
            native-${{ matrix.target }}-${{ steps.toolchain.outputs.sha256 }}-
            ${{ runner.os == 'macOS' && format('native-{0}-{1}-{2}-', matrix.target, runner.os, hashFiles('configure.ac', 'modules/gui/qt/qt6.pro', 'modules/gui/qt/player/mpv/source-portable.json', 'contrib/src/medialibrary/**')) || '' }}
      - name: Check unchanged normal package for test-only repair
        id: review_reuse
        run: python3 tools/desktop-player/reuse-native-review.py --work "$GITHUB_WORKSPACE/.desktop-build" ${{ inputs.native_ui_only && '--require-reuse' || '' }}
      - name: Verify owned native command cancellation
        run: python3 tools/desktop-player/test-native-build-cancellation.py --receipt "$RUNNER_TEMP/native-command-cancellation.json"
      - name: Build native redesign and packages
        id: normal_build
        if: steps.review_reuse.outputs.reuse != 'true'
        run: python3 tools/desktop-player/build-native.py --work "$GITHUB_WORKSPACE/.desktop-build"
      - name: Verify recovered normal macOS ZIP and DMG applications
        if: runner.os == 'macOS'
        run: python3 tools/desktop-player/verify-macos-packages.py --work "$GITHUB_WORKSPACE/.desktop-build" --scratch "$RUNNER_TEMP/native-package-checks"
      - name: Exercise the actual native player
        if: ${{ !cancelled() && runner.os == 'macOS' && (steps.normal_build.outcome == 'success' || steps.review_reuse.outputs.reuse == 'true') }}
        run: python3 tools/desktop-player/prepare-native-review.py --work "$GITHUB_WORKSPACE/.desktop-build" --review-root "$RUNNER_TEMP/native-player-review"
      - name: Install Linux crash observer
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.normal_build.outcome == 'success' || steps.review_reuse.outputs.reuse == 'true') }}
        run: sudo -n apt-get install -y --no-upgrade --no-install-recommends gdb
      - name: Exercise the actual Linux player on its owned display
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.normal_build.outcome == 'success' || steps.review_reuse.outputs.reuse == 'true') }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24 +extension GLX' /usr/bin/python3 tools/desktop-player/run-linux-review.py ${{ inputs.native_ui_only && '--ui-only' || '' }} --work "$GITHUB_WORKSPACE/.desktop-build" --review-root "$RUNNER_TEMP/native-player-review"
      - name: Preserve package and failure evidence
        id: native_artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .desktop-build/packages/${{ steps.review_reuse.outputs.normal_generation || github.sha }}/**
            .desktop-build/native-build.json
            .desktop-build/generation-retention.json
            .desktop-build/package-output.json
            .desktop-build/review-reuse.json
            .desktop-build/qml-deployment/${{ steps.review_reuse.outputs.normal_generation || github.sha }}.json
            .desktop-build/native-link-bindings.json
            .desktop-build/native-reconfiguration.json
            .desktop-build/bootstrap-cache-migration.json
            .desktop-build/bootstrap-inputs.json
            .desktop-build/native-contrib-overlays/*/aom/vlc_build/CMakeCache.txt
            .desktop-build/native-contrib-overlays/images/build-receipt.json
            .desktop-build/native-contrib-overlays/images/link-receipt.json
            .desktop-build/native-contrib-overlays/images/link-maps/*.map
            .desktop-toolchain/**
            .desktop-build/sources/*
            .desktop-sources/**/manifest.json
            .desktop-sources/**/homebrew/**/manifest.json
            .desktop-build/vlc-build/config.log
            .desktop-build/build-*/meson-logs/meson-log.txt
            .desktop-build/build-*/modern-vlc-library-only-migration.json
            ${{ runner.temp }}/native-player-review/acceptance/**
            ${{ runner.temp }}/native-player-review/*json
            ${{ runner.temp }}/native-player-review-session/*
            ${{ runner.temp }}/native-package-checks/verification.json
            ${{ runner.temp }}/native-package-checks/*-runtime/*log
            ${{ runner.temp }}/native-package-checks/*-runtime/*json
            ${{ runner.temp }}/native-package-checks/*-runtime/crashes/**
            ${{ runner.temp }}/native-package-checks/*-runtime/*/*.log
            ${{ runner.temp }}/native-package-checks/*-runtime/*/*.json
            ${{ runner.temp }}/native-package-checks/*-runtime/*/crashes/**
            ${{ runner.temp }}/native-package-checks/installer-exit.json
            ${{ runner.temp }}/native-package-checks/*/*-stdout.log
            ${{ runner.temp }}/native-package-checks/*/*-stderr.log
            ${{ runner.temp }}/native-package-checks/*/*txt
            ${{ runner.temp }}/native-package-checks/*/*-fault.json
            ${{ runner.temp }}/native-package-checks/*-installed/*json
            ${{ runner.temp }}/native-package-checks/*-installed/*txt
            ${{ runner.temp }}/native-package-checks/*-installed/container.log
            ${{ runner.temp }}/native-command-cancellation.json
      - name: Separate uploaded package copies from compiler continuation
        if: ${{ always() && steps.native_artifacts.outcome == 'success' }}
        run: python3 tools/desktop-player/compact-native-cache.py --work "$GITHUB_WORKSPACE/.desktop-build" --uploaded-artifact "${{ steps.native_artifacts.outputs.artifact-id }}" --normal-source "${{ steps.review_reuse.outputs.normal_generation || github.sha }}"
      - name: Retain original native build for repair and resumption
        id: saved_cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Retire superseded snapshots of the saved native cohort
        if: ${{ always() && steps.saved_cache.outcome == 'success' && steps.cache.outputs.cache-primary-key != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/desktop-player/compact-native-cache.py --work "$GITHUB_WORKSPACE/.desktop-build" --retire-saved-key "${{ steps.cache.outputs.cache-primary-key }}" --target "${{ matrix.target }}"
  cache-compaction:
    if: ${{ inputs.cache_compaction != '' }}
    runs-on: ${{ inputs.target == 'macos-intel' && 'macos-15-intel' || inputs.target == 'macos-arm64' && 'macos-15' || inputs.target == 'linux-aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_COMPACTION: ${{ inputs.cache_compaction }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify the exact retained cache and original uploaded artifact
        id: binding
        run: python3 tools/desktop-player/compact-native-cache.py --prepare-request "$CACHE_COMPACTION" --target "${{ inputs.target }}"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-build
          key: ${{ steps.binding.outputs.key }}
          fail-on-cache-miss: true
      - name: Compact only uploaded copies; preserve original compiler continuation
        run: python3 tools/desktop-player/compact-native-cache.py --work "$GITHUB_WORKSPACE/.desktop-build" --uploaded-artifact "${{ steps.binding.outputs.artifact }}" --normal-source "${{ steps.binding.outputs.source }}"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-build
          key: ${{ steps.binding.outputs.key }}-compact-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cache-retention-${{ inputs.target }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: .desktop-build/native-cache-retention.json
  package-checks:
    if: ${{ inputs.package_artifact != '' }}
    runs-on: ${{ inputs.target == 'linux-aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
      PACKAGE_SOURCE: ${{ inputs.package_source }}
      PACKAGE_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install only package review dependencies
        run: bash tools/desktop-player/install-linux-review-dependencies.sh
      - name: Recover exact published build artifact without compiling
        run: python3 tools/desktop-player/recover-linux-packages.py --artifact "$PACKAGE_ARTIFACT" --source "$PACKAGE_SOURCE" --target "$PACKAGE_TARGET" --work "$GITHUB_WORKSPACE/.package-review/work" --scratch "$RUNNER_TEMP/package-artifact-input"
      - name: Verify real Linux package installations and playback
        if: ${{ !inputs.startup_trace }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24 +extension GLX' /usr/bin/python3 tools/desktop-player/run-linux-review.py --packages-only --work "$GITHUB_WORKSPACE/.package-review/work" --review-root "$RUNNER_TEMP/recovered-player-review"
      - name: Diagnose recovered normal Linux startup without compiling
        if: ${{ inputs.startup_trace }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24 +extension GLX' /usr/bin/python3 tools/desktop-player/run-linux-review.py --startup-trace --trace-engine "${{ inputs.trace_engine }}" --work "$GITHUB_WORKSPACE/.package-review/work" --review-root "$RUNNER_TEMP/recovered-player-review"
      - name: Preserve package qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-checks-${{ inputs.target }}-${{ inputs.package_artifact }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .package-review/work/package-recovery.json
            ${{ runner.temp }}/recovered-player-review/diagnosis.json
            ${{ runner.temp }}/recovered-player-review/gdb-mi.log
            ${{ runner.temp }}/recovered-player-review/launch-*/*log
            ${{ runner.temp }}/recovered-player-review-session/*json
            ${{ runner.temp }}/recovered-player-review-session/*txt
            ${{ runner.temp }}/recovered-player-review-session/*log
            ${{ runner.temp }}/native-package-checks/*json
            ${{ runner.temp }}/native-package-checks/*-installed/*json
            ${{ runner.temp }}/native-package-checks/*-installed/*txt
            ${{ runner.temp }}/native-package-checks/*-installed/*log
            ${{ runner.temp }}/native-package-checks/*/*txt
            ${{ runner.temp }}/native-package-checks/*/*-fault.json
            ${{ runner.temp }}/native-package-checks/*/*-stdout.log
            ${{ runner.temp }}/native-package-checks/*/*-stderr.log
