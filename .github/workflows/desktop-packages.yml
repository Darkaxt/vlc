name: Native desktop packages
on:
  push:
    branches: [codex/native-desktop]
  workflow_dispatch:
    inputs:
      target:
        description: Native build target
        type: choice
        options: [macos-arm64, macos-intel, linux-x86_64, linux-aarch64, all]
        default: macos-arm64
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - id: select
        env:
          TARGET: ${{ inputs.target || 'macos-arm64' }}
        run: |
          case "$TARGET" in
            all) echo 'targets=["macos-arm64","macos-intel","linux-x86_64","linux-aarch64"]' >> "$GITHUB_OUTPUT" ;;
            *) printf 'targets=["%s"]\n' "$TARGET" >> "$GITHUB_OUTPUT" ;;
          esac
  build:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-intel
            runner: macos-15-intel
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create native work directory
        run: mkdir -p "$GITHUB_WORKSPACE/.desktop-build"
      - name: Install native dependencies
        run: bash tools/desktop-player/install-ci-dependencies.sh "$GITHUB_WORKSPACE/.desktop-build"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: .desktop-build
          key: native-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('configure.ac', 'modules/gui/qt/qt6.pro', 'modules/gui/qt/player/mpv/source-portable.json', 'contrib/src/medialibrary/**') }}-${{ github.run_id }}
          restore-keys: |
            native-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('configure.ac', 'modules/gui/qt/qt6.pro', 'modules/gui/qt/player/mpv/source-portable.json', 'contrib/src/medialibrary/**') }}-
      - name: Build native redesign and packages
        run: python3 tools/desktop-player/build-native.py --work "$GITHUB_WORKSPACE/.desktop-build"
      - name: Retain original native build for repair and resumption
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .desktop-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve package and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .desktop-build/packages/*
            .desktop-build/native-build.json
            .desktop-build/*packages.*
            .desktop-build/sources/*
            .desktop-build/vlc-build/config.log
            .desktop-build/build-*/meson-logs/meson-log.txt
